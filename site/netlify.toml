# Netlify config — only used if you deploy here instead of Cloudflare Pages.
# Cloudflare Pages reads public/_headers directly and needs no config file.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
